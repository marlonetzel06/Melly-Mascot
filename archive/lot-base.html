<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melly Base-Figur</title>
<style>
  :root { --ink:#0B1620; --navy:#041C2C; --paper:#F5F3EE; --muted:#6B7280; --line:#E4E0D8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width:1180px; margin:0 auto; padding:28px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h2 { font-size:16px; margin:0 0 2px; }
  .card p { font-size:13px; color:var(--muted); margin:0 0 12px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stage { border-radius:10px; display:flex; align-items:flex-end; justify-content:center; padding:14px 0 10px; }
  .stage.dark { background:var(--navy); }
  .stage.light { background:var(--paper); border:1px solid var(--line); }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  .row { display:flex; gap:24px; align-items:flex-end; background:var(--navy); border-radius:12px; padding:18px; margin-top:16px; flex-wrap:wrap; }
  .row span { color:#9fb3c2; font:11px ui-monospace, Consolas, monospace; display:block; margin-top:6px; text-align:center; }
  .sw { display:flex; gap:16px; margin-top:16px; flex-wrap:wrap; font:12px ui-monospace, Consolas, monospace; color:var(--muted); }
  .sw div { display:flex; align-items:center; gap:8px; }
  .sw i { width:28px; height:28px; border-radius:6px; display:inline-block; }
</style>
</head>
<body>
<main>
  <h1>Melly · Base-Figur</h1>
  <p class="sub">40×64 Raster · ca. 2,6 Köpfe hoch (Aufbau wie Francis) · 1 px Outline · Signatur: Messing-Scheitel mit 45°-Kante + skeptische Braue + Schmunzeln · gleicher Kopf, 3 Grund-Outfits</p>

  <div class="grid" id="variants"></div>

  <div class="row" id="sizes"></div>

  <div class="sw">
    <div><i style="background:#E3A33B"></i>Messing #E3A33B (Lot)</div>
    <div><i style="background:#D97757"></i>Claude #D97757</div>
    <div><i style="background:#E8683A"></i>Francis ~#E8683A</div>
    <div><i style="background:#041C2C"></i>M&amp;M Navy #041C2C</div>
  </div>
</main>

<script>
const PAL = {
  O:'#0B1620', H:'#E3A33B', h:'#B87A1E', L:'#F6CC7A',
  S:'#F1C7A0', s:'#D9A57E', m:'#A8644E', E:'#0B1620',
  W:'#F2EFE8', w:'#CFCBC0', N:'#1D4563', n:'#123049',
  K:'#1E2328', k:'#3A424C', J:'#2D6A8E', j:'#215572',
  T:'#3A4552', t:'#2B343F', P:'#E89090'
};
const GW = 40, GH = 64;

function canvasGrid() {
  const g = Array.from({length:GH}, () => Array(GW).fill('.'));
  const R = (x0,y0,x1,y1,c) => { for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (x>=0&&y>=0&&x<GW&&y<GH) g[y][x]=c; };
  const D = (x,y,c) => { if (x>=0&&y>=0&&x<GW&&y<GH) g[y][x]=c; };
  const P = (pts,c) => {
    for (let y=0;y<GH;y++) for (let x=0;x<GW;x++) {
      const px=x+.5, py=y+.5; let ins=false;
      for (let i=0,j=pts.length-1;i<pts.length;j=i++) {
        const [xi,yi]=pts[i],[xj,yj]=pts[j];
        if (((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins;
      }
      if (ins) g[y][x]=c;
    }
  };
  return {g,R,D,P};
}

function draw(v) {
  const {g,R,D,P} = canvasGrid();

  R(12,43,27,57,'N'); R(19,47,20,57,'.');
  R(12,44,12,57,'n'); R(21,47,21,57,'n'); R(12,43,27,43,'n');
  R(11,58,18,60,'K'); R(21,58,28,60,'K'); R(12,58,15,58,'k'); R(22,58,25,58,'k');

  R(11,27,28,42,v.top); R(11,27,12,42,v.shade);
  R(7,28,9,43,v.top); R(30,28,32,43,v.top); R(7,28,7,43,v.shade); R(30,28,30,43,v.shade);
  if (v.rolled) {
    R(7,36,9,37,'w'); R(30,36,32,37,'w');
    R(7,38,9,43,'S'); R(30,38,32,43,'S'); R(7,38,7,43,'s'); R(30,38,30,43,'s');
  }
  R(7,44,9,46,'S'); R(30,44,32,46,'S'); R(7,46,9,46,'s'); R(30,46,32,46,'s');

  R(17,25,22,26,'s');

  R(11,6,28,24,'S'); R(11,15,11,22,'s');
  D(11,23,'.'); D(11,24,'.'); D(12,24,'.'); D(28,23,'.'); D(28,24,'.'); D(27,24,'.');
  R(13,24,26,24,'s'); D(12,23,'s'); D(27,23,'s');
  R(9,15,10,18,'S'); R(29,15,30,18,'S'); D(10,16,'s'); D(10,17,'s'); D(29,16,'s'); D(29,17,'s');

  R(11,4,28,9,'H'); R(11,10,12,14,'H'); R(27,10,28,13,'H');
  P([[13,7],[19,1],[31,1],[31,5],[29,8],[13,8]],'H');
  R(13,9,28,9,'h'); R(11,13,12,14,'h'); R(30,2,30,6,'h');
  R(20,2,28,2,'L'); D(19,3,'L');
  D(16,7,'h'); D(17,6,'h'); D(18,5,'h'); D(19,4,'h'); D(20,3,'h');

  R(14,12,17,12,'h'); D(21,12,'h'); R(22,11,24,11,'h');
  R(15,15,16,16,'E'); R(22,15,23,16,'E');
  R(19,17,20,18,'s');
  R(17,21,20,21,'m'); D(21,20,'m');

  if (v.collar === 'open') {
    P([[17,27],[23,27],[20,31]],'s');
    R(15,27,16,28,'w'); R(23,27,24,28,'w');
  }
  if (v.suspenders) {
    R(14,27,15,42,'H'); R(24,27,25,42,'H'); R(15,27,15,42,'h'); R(25,27,25,42,'h');
  }
  if (v.jacket) {
    R(17,27,22,28,'W'); R(20,29,20,42,'H');
    R(23,31,26,34,v.shade); R(24,29,24,30,'H'); D(24,28,'K');
  }
  if (v.turtle) {
    R(15,23,24,26,v.top); R(15,26,24,26,v.shade);
    D(28,14,'P'); D(29,13,'H'); D(30,12,'H'); D(31,11,'H'); D(32,10,'h'); D(33,9,'K');
  }

  const out = g.map(r => r.slice());
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++) {
    if (g[y][x] !== '.') continue;
    if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => { const c = g[y+dy]?.[x+dx]; return c && c !== '.'; })) out[y][x] = 'O';
  }
  return out;
}

function render(grid, scale) {
  const c = document.createElement('canvas');
  c.width = GW*scale; c.height = GH*scale;
  const x = c.getContext('2d');
  grid.forEach((row,y) => row.forEach((p,i) => { if (p !== '.') { x.fillStyle = PAL[p]; x.fillRect(i*scale, y*scale, scale, scale); } }));
  return c;
}

const VARIANTS = [
  { name:'A · Hosenträger', note:'Hemd mit hochgekrempelten Ärmeln, Hosenträger in Messing. Wirkt wie ein Macher und lässt sich mit jedem Outfit überziehen.', top:'W', shade:'w', rolled:true, collar:'open', suspenders:true },
  { name:'B · Werkjacke', note:'Werkjacke in Blau mit Reißverschluss und Bleistift in der Brusttasche. Wirkt am meisten nach Werkstatt.', top:'J', shade:'j', jacket:true },
  { name:'C · Rollkragen', note:'Dunkler Rollkragen nach dem Prinzip „weniger, aber besser“, Bleistift hinterm Ohr. Wirkt am ruhigsten und erwachsensten.', top:'T', shade:'t', turtle:true }
];

const wrap = document.getElementById('variants');
const sizes = document.getElementById('sizes');
VARIANTS.forEach(v => {
  const g = draw(v);
  const card = document.createElement('section'); card.className = 'card';
  card.innerHTML = `<h2>${v.name}</h2><p>${v.note}</p><div class="pair"><div class="stage dark"></div><div class="stage light"></div></div>`;
  card.querySelector('.dark').appendChild(render(g,4));
  card.querySelector('.light').appendChild(render(g,4));
  wrap.appendChild(card);
  [1,2].forEach(s => { const d = document.createElement('div'); d.appendChild(render(g,s));const lbl = document.createElement('span'); lbl.textContent = v.name.split(' · ')[0] + ' ' + s + '×'; d.appendChild(lbl); sizes.appendChild(d); });
});
</script>
</body>
</html>
