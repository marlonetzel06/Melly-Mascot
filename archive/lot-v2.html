<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melly Charakter v2</title>
<style>
  :root { --ink:#0B1620; --navy:#041C2C; --paper:#F5F3EE; --muted:#6B7280; --line:#E4E0D8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width:1180px; margin:0 auto; padding:28px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:16px; margin:24px 0 8px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .cell { background:var(--navy); border-radius:12px; padding:14px 18px 10px; display:flex; flex-direction:column; align-items:center; }
  .cell.light { background:#fff; border:1px solid var(--line); }
  .cell span { font:12px ui-monospace, Consolas, monospace; color:#9fb3c2; margin-top:8px; text-align:center; }
  .cell.light span { color:var(--muted); }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
</style>
</head>
<body>
<main>
  <h1>Melly · Charakter v2</h1>
  <p class="sub">Gleicher Körper · neu: Trainingsjacke mit Messing-Paspel, Sneaker, Frisur und Mimik tragen den Charakter</p>

  <h2>1 · Drei Köpfe auf demselben Körper</h2>
  <div class="row" id="heads"></div>

  <h2>2 · Mimik-Blatt (Kopf A) · so entsteht Persönlichkeit</h2>
  <div class="row" id="faces"></div>

  <h2>3 · Auf hellem Grund</h2>
  <div class="row" id="light"></div>
</main>

<script>
const PAL = {
  O:'#0B1620', H:'#E3A33B', h:'#B87A1E', L:'#F6CC7A', d:'#8A5A14',
  S:'#F1C7A0', s:'#D9A57E', m:'#7A3B2E', E:'#0B1620', X:'#FFFFFF',
  W:'#F4F2EC', w:'#C9C5BA', J:'#1F3B57', j:'#152B41', G:'#2B323B', g:'#20262D',
  B:'#7FC8F8'
};
const GW = 40, GH = 64;

function grid() {
  const g = Array.from({length:GH}, () => Array(GW).fill('.'));
  const R = (x0,y0,x1,y1,c) => { for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (x>=0&&y>=0&&x<GW&&y<GH) g[y][x]=c; };
  const D = (x,y,c) => { if (x>=0&&y>=0&&x<GW&&y<GH) g[y][x]=c; };
  const P = (pts,c) => {
    for (let y=0;y<GH;y++) for (let x=0;x<GW;x++) {
      const px=x+.5, py=y+.5; let ins=false;
      for (let i=0,j=pts.length-1;i<pts.length;j=i++) {
        const [xi,yi]=pts[i],[xj,yj]=pts[j];
        if (((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins;
      }
      if (ins) g[y][x]=c;
    }
  };
  return {g,R,D,P};
}

function body(R,D,P) {
  R(12,43,27,56,'G'); R(19,47,20,56,'.'); R(12,44,12,56,'g'); R(21,47,21,56,'g');
  R(12,55,18,56,'g'); R(21,55,27,56,'g');
  R(11,57,18,60,'W'); R(21,57,28,60,'W'); R(11,60,18,60,'w'); R(21,60,28,60,'w');
  R(14,58,16,58,'H'); R(24,58,26,58,'H');

  R(11,27,28,42,'J'); R(11,27,12,42,'j'); R(11,41,28,42,'j');
  R(7,28,9,37,'J'); R(30,28,32,37,'J'); R(7,28,7,37,'j'); R(30,28,30,37,'j');
  R(9,28,9,37,'H'); R(32,28,32,37,'H');
  R(7,36,9,37,'j'); R(30,36,32,37,'j');
  R(7,38,9,43,'S'); R(30,38,32,43,'S'); R(7,38,7,43,'s'); R(30,38,30,43,'s');
  R(7,44,9,46,'S'); R(30,44,32,46,'S'); R(7,46,9,46,'s'); R(30,46,32,46,'s');

  R(16,25,23,27,'J'); R(16,27,23,27,'j'); R(19,25,20,27,'W');
  R(20,28,20,40,'H');
  R(14,30,17,30,'H');
}

function head(R,D,P,hair) {
  R(11,6,28,24,'S'); R(11,15,11,22,'s');
  D(11,23,'.'); D(11,24,'.'); D(12,24,'.'); D(28,23,'.'); D(28,24,'.'); D(27,24,'.');
  R(13,24,26,24,'s'); D(12,23,'s'); D(27,23,'s');
  R(9,15,10,18,'S'); R(29,15,30,18,'S'); D(10,16,'s'); D(10,17,'s'); D(29,16,'s'); D(29,17,'s');

  if (hair === 'messy') {
    R(11,4,28,9,'H'); R(11,10,12,13,'H'); R(27,10,28,12,'H');
    R(12,3,15,3,'H'); R(17,2,20,3,'H'); R(22,1,25,3,'H'); R(26,3,28,3,'H');
    D(13,2,'H'); D(18,1,'H'); D(23,0,'H'); D(24,0,'H');
    R(18,2,19,2,'L'); R(23,1,24,1,'L'); R(14,4,26,4,'L');
    R(13,9,26,9,'h'); D(15,10,'H'); D(16,10,'H'); D(20,10,'H'); D(24,10,'H'); D(25,10,'H');
    D(16,6,'h'); D(21,5,'h'); D(25,6,'h');
  }
  if (hair === 'undercut') {
    R(11,7,12,13,'d'); R(27,7,28,12,'d');
    R(12,3,28,8,'H');
    P([[12,6],[16,1],[31,1],[31,4],[28,8],[12,8]],'H');
    R(17,2,28,2,'L'); R(13,8,28,8,'h'); R(30,2,30,4,'h');
    D(15,5,'h'); D(16,4,'h'); D(17,3,'h');
  }
  if (hair === 'band') {
    R(11,4,28,7,'H'); R(11,10,12,13,'H'); R(27,10,28,12,'H');
    R(12,3,15,3,'H'); R(17,2,20,3,'H'); R(22,1,25,3,'H'); R(26,3,28,3,'H');
    D(18,1,'H'); D(23,0,'H'); R(14,4,26,4,'L'); R(23,1,24,1,'L');
    R(11,8,28,10,'W'); R(11,9,28,9,'H'); R(11,10,28,10,'w');
    R(15,11,16,11,'H'); R(23,11,24,11,'H');
  }
}

function face(R,D,P,mood) {
  if (mood === 'begeistert') {
    R(14,12,17,12,'h'); R(22,12,25,12,'h'); D(14,13,'h'); D(25,13,'h');
    R(15,14,17,16,'E'); R(22,14,24,16,'E'); D(15,14,'X'); D(22,14,'X');
    R(19,17,20,18,'s');
    R(16,20,23,22,'m'); R(17,20,22,20,'X'); D(16,22,'S'); D(23,22,'S');
  }
  if (mood === 'skeptisch') {
    R(14,13,17,13,'h'); D(21,12,'h'); R(22,11,24,11,'h');
    R(15,15,17,16,'E'); R(22,14,24,16,'E'); D(15,15,'X'); D(22,14,'X');
    R(19,17,20,18,'s');
    R(17,21,20,21,'m'); D(21,20,'m');
  }
  if (mood === 'fokus') {
    D(14,12,'h'); R(15,13,17,13,'h'); D(25,12,'h'); R(22,13,24,13,'h');
    R(15,15,17,15,'E'); R(22,15,24,15,'E'); R(16,16,17,16,'E'); R(23,16,24,16,'E');
    R(19,17,20,18,'s');
    R(17,21,22,21,'m');
  }
  if (mood === 'ungeduldig') {
    R(14,12,17,12,'h'); R(22,12,25,12,'h');
    R(15,15,17,16,'X'); R(22,15,24,16,'X'); R(16,15,17,16,'E'); R(23,15,24,16,'E');
    R(19,17,20,18,'s');
    R(18,21,21,21,'m'); D(17,22,'m'); D(22,20,'m');
    R(31,10,31,12,'B'); D(30,12,'B'); R(30,13,31,13,'B');
  }
  if (mood === 'zufrieden') {
    D(14,13,'h'); R(15,12,17,12,'h'); R(22,12,24,12,'h'); D(25,13,'h');
    R(15,15,17,15,'E'); D(14,16,'E'); D(18,16,'E'); R(22,15,24,15,'E'); D(21,16,'E'); D(25,16,'E');
    R(19,17,20,18,'s');
    D(16,20,'m'); R(17,21,22,21,'m'); D(23,20,'m');
  }
}

function outline(g) {
  const out = g.map(r => r.slice());
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++) {
    if (g[y][x] !== '.') continue;
    if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => { const c = g[y+dy]?.[x+dx]; return c && c !== '.'; })) out[y][x] = 'O';
  }
  return out;
}

function build(hair, mood) {
  const {g,R,D,P} = grid();
  body(R,D,P); head(R,D,P,hair); face(R,D,P,mood);
  return outline(g);
}

function render(gr, scale, crop) {
  const h = crop ? 28 : GH;
  const c = document.createElement('canvas');
  c.width = GW*scale; c.height = h*scale;
  const x = c.getContext('2d');
  for (let y=0;y<h;y++) gr[y].forEach((p,i) => { if (p !== '.') { x.fillStyle = PAL[p]; x.fillRect(i*scale, y*scale, scale, scale); } });
  return c;
}

function cell(target, canvas, label, light) {
  const d = document.createElement('div'); d.className = 'cell' + (light ? ' light' : '');
  d.appendChild(canvas);
  const s = document.createElement('span'); s.textContent = label; d.appendChild(s);
  document.getElementById(target).appendChild(d);
}

[['messy','A · Wuschel'],['undercut','B · Undercut 45°'],['band','C · Stirnband']].forEach(([h,l]) => cell('heads', render(build(h,'begeistert'),5), l));
[['begeistert','begeistert'],['skeptisch','„Zeig mal.“'],['fokus','Game Face'],['ungeduldig','ungeduldig'],['zufrieden','„Fast.“']].forEach(([m,l]) => cell('faces', render(build('messy',m),5,true), l));
[['messy','A'],['undercut','B'],['band','C']].forEach(([h,l]) => cell('light', render(build(h,'begeistert'),3), l, true));
</script>
</body>
</html>
