<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melly Outfits v3</title>
<style>
  :root { --ink:#0B1620; --navy:#041C2C; --paper:#F5F3EE; --muted:#6B7280; --line:#E4E0D8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width:1180px; margin:0 auto; padding:28px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:16px; margin:24px 0 8px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .row { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .cell { background:var(--navy); border-radius:12px; padding:14px 10px 10px; display:flex; flex-direction:column; align-items:center; }
  .cell b { font:600 13px ui-sans-serif, system-ui; color:#E8EEF2; margin-top:8px; }
  .cell span { font:12px ui-sans-serif, system-ui; color:#9fb3c2; margin-top:2px; text-align:center; line-height:1.35; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
</style>
</head>
<body>
<main>
  <h1>Melly · Outfits v3</h1>
  <p class="sub">Kopf A (neu: Strähnen nach rechts geweht statt Krone) · gleicher Körper · 7 Outfit-Richtungen + v2 zum Vergleich</p>

  <h2>Kopf A: vorher / nachher</h2>
  <div class="row" id="hair"></div>

  <h2>Outfit-Richtungen</h2>
  <div class="row" id="outfits"></div>
</main>

<script>
const PAL = {
  O:'#0B1620', H:'#E3A33B', h:'#B87A1E', L:'#F6CC7A', d:'#8A5A14',
  S:'#F1C7A0', s:'#D9A57E', m:'#7A3B2E', E:'#0B1620', X:'#FFFFFF',
  W:'#F4F2EC', w:'#C9C5BA', J:'#1F3B57', j:'#152B41', G:'#2B323B', g:'#20262D',
  K:'#14181D', k:'#262C33', C:'#3E7CB1', R:'#9B3D2E', r:'#7A2E22'
};
const GW = 40, GH = 64;

function grid() {
  const g = Array.from({length:GH}, () => Array(GW).fill('.'));
  const R = (x0,y0,x1,y1,c) => { for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (x>=0&&y>=0&&x<GW&&y<GH) g[y][x]=c; };
  const D = (x,y,c) => { if (x>=0&&y>=0&&x<GW&&y<GH) g[y][x]=c; };
  const P = (pts,c) => {
    for (let y=0;y<GH;y++) for (let x=0;x<GW;x++) {
      const px=x+.5, py=y+.5; let ins=false;
      for (let i=0,j=pts.length-1;i<pts.length;j=i++) {
        const [xi,yi]=pts[i],[xj,yj]=pts[j];
        if (((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins;
      }
      if (ins) g[y][x]=c;
    }
  };
  const T = (x,y,rows,c) => rows.forEach((r,dy) => [...r].forEach((ch,dx) => { if (ch==='#') D(x+dx,y+dy,c); }));
  return {g,R,D,P,T};
}

const LOGO = ['..#..','..#..','.###.','#####','.###.','..#..'];

function base(R,D) {
  R(12,43,27,56,'G'); R(19,47,20,56,'.'); R(12,44,12,56,'g'); R(21,47,21,56,'g');
  R(11,57,18,60,'W'); R(21,57,28,60,'W'); R(11,60,18,60,'w'); R(21,60,28,60,'w');
  R(14,58,16,58,'H'); R(24,58,26,58,'H');
  R(17,25,22,26,'s');
  R(7,44,9,46,'S'); R(30,44,32,46,'S'); R(7,46,9,46,'s'); R(30,46,32,46,'s');
}
function arms(R, top, shade, sleeveEnd) {
  R(7,28,9,sleeveEnd,top); R(30,28,32,sleeveEnd,top); R(7,28,7,sleeveEnd,shade); R(30,28,30,sleeveEnd,shade);
  if (sleeveEnd < 43) { R(7,sleeveEnd+1,9,43,'S'); R(30,sleeveEnd+1,32,43,'S'); R(7,sleeveEnd+1,7,43,'s'); R(30,sleeveEnd+1,30,43,'s'); }
}
function torso(R, top, shade) { R(11,27,28,42,top); R(11,27,12,42,shade); }

const OUTFITS = {
  track: { name:'v2 · Trainingsjacke', note:'zum Vergleich', draw({R,D}) {
    torso(R,'J','j'); arms(R,'J','j',37); R(9,28,9,37,'H'); R(32,28,32,37,'H'); R(7,36,9,37,'j'); R(30,36,32,37,'j');
    R(16,25,23,27,'J'); R(19,25,20,27,'W'); R(20,28,20,40,'H'); R(14,30,17,30,'H'); R(11,41,28,42,'j');
  }},
  bomber: { name:'Bomber', note:'Streetwear, Messing-Rippbündchen, Ärmeltasche', draw({R,D}) {
    R(10,27,29,41,'J'); R(10,27,12,41,'j'); arms(R,'J','j',41);
    R(7,42,9,43,'H'); R(30,42,32,43,'H'); R(7,43,9,43,'h'); R(30,43,32,43,'h');
    R(10,40,29,42,'H'); R(10,41,29,41,'h');
    R(15,25,24,27,'H'); R(15,26,24,26,'h'); R(18,25,21,27,'W');
    R(20,28,20,39,'w'); R(8,31,9,33,'H'); D(8,31,'h');
  }},
  jersey: { name:'Trikot „10“', note:'Spielmacher, Fußball-Kit komplett', draw({R,D,T}) {
    torso(R,'W','w'); arms(R,'W','w',33); R(7,32,9,33,'J'); R(30,32,32,33,'J');
    R(16,25,23,27,'J'); R(18,26,21,27,'s'); R(11,27,11,42,'J'); R(28,27,28,42,'J');
    T(16,31,['.#.','##.','.#.','.#.','###'],'H'); T(21,31,['###','#.#','#.#','#.#','###'],'H');
    R(12,43,27,48,'J'); R(19,47,20,48,'.'); R(12,43,27,43,'j');
    R(12,49,18,50,'S'); R(21,49,27,50,'S'); R(19,49,20,56,'.');
    R(12,51,18,56,'W'); R(21,51,27,56,'W'); R(12,52,18,52,'H'); R(21,52,27,52,'H'); R(12,51,12,56,'w'); R(21,51,21,56,'w');
  }},
  hoodie: { name:'Hoodie + Senklot', note:'Dev-Uniform, Logo auf der Brust', draw({R,D,T}) {
    R(13,23,26,27,'g'); torso(R,'G','g'); arms(R,'G','g',41); R(7,40,9,41,'g'); R(30,40,32,41,'g');
    R(16,25,23,26,'G'); R(17,27,17,32,'W'); R(22,27,22,32,'W');
    R(14,36,25,40,'g'); R(14,36,25,36,'k');
    T(17,29,LOGO,'H');
    R(11,41,28,42,'g');
  }},
  vest: { name:'Utility-Weste', note:'The-Finals-Vibe, Taschen & Werkzeug', draw({R,D}) {
    torso(R,'W','w'); arms(R,'W','w',30);
    R(11,27,17,42,'k'); R(22,27,28,42,'k'); R(11,27,12,42,'K'); R(22,27,22,42,'K');
    R(13,32,16,35,'K'); R(23,32,27,35,'K'); R(13,32,16,32,'H'); R(23,32,27,32,'H');
    R(13,38,16,40,'K'); R(23,38,27,40,'K');
    D(26,29,'H'); D(26,30,'H'); D(26,31,'h');
    R(11,41,28,42,'K'); R(18,41,21,42,'H');
  }},
  varsity: { name:'Varsity', note:'Navy-Korpus, Ärmel hell, Patch', draw({R,D,T}) {
    torso(R,'J','j'); arms(R,'W','w',41);
    R(7,42,9,43,'H'); R(30,42,32,43,'H'); R(7,42,9,42,'J'); R(30,42,32,42,'J');
    R(15,25,24,27,'H'); R(15,26,24,26,'J');
    R(11,40,28,42,'H'); R(11,41,28,41,'J');
    R(20,28,20,39,'W'); D(19,30,'W'); D(19,33,'W'); D(19,36,'W');
    R(13,29,18,36,'W'); T(13,30,['..#...','..#...','.###..','#####.','.###..','..#...'],'H');
  }},
  flannel: { name:'Overshirt + LAN-Kabel', note:'Bastler, Kabel über der Schulter', draw({R,D}) {
    torso(R,'R','r'); arms(R,'R','r',36);
    for (let x=11;x<=28;x+=3) R(x,27,x,42,'r'); for (let y=29;y<=42;y+=4) R(11,y,28,y,'r');
    for (let x of [7,30]) for (let y=29;y<=36;y+=4) R(x,y,x+2,y,'r');
    R(7,36,9,37,'r'); R(30,36,32,37,'r');
    R(16,27,23,42,'W'); R(16,27,16,42,'w');
    R(16,25,23,26,'R'); R(18,26,21,27,'s');
    R(12,28,13,28,'C'); R(13,29,14,29,'C'); R(14,30,15,30,'C'); R(15,31,15,31,'C');
    R(24,28,25,28,'C'); R(25,29,26,30,'C'); R(26,31,26,32,'C'); R(25,33,26,33,'C'); D(24,34,'C'); D(24,35,'W'); D(24,36,'W');
  }},
  tech: { name:'Techwear + Sling', note:'Hochkragen, schräger Zip, Crossbody-Bag', draw({R,D,P}) {
    torso(R,'K','K'); arms(R,'K','k',41); R(7,40,9,41,'k'); R(30,40,32,41,'k');
    R(15,23,24,27,'K'); R(15,23,24,23,'k');
    for (let i=0;i<14;i++) D(23-i%2-Math.floor(i/2),28+i,'H');
    for (let i=0;i<15;i++) { D(12+i,28+i,'k'); D(13+i,28+i,'k'); }
    R(24,38,28,42,'G'); R(24,38,28,38,'H'); D(26,40,'H');
  }}
};

function hairOld(R,D) {
  R(11,4,28,9,'H'); R(11,10,12,13,'H'); R(27,10,28,12,'H');
  R(12,3,15,3,'H'); R(17,2,20,3,'H'); R(22,1,25,3,'H'); R(26,3,28,3,'H');
  D(13,2,'H'); D(18,1,'H'); D(23,0,'H'); D(24,0,'H');
  R(18,2,19,2,'L'); R(23,1,24,1,'L'); R(14,4,26,4,'L');
  R(13,9,26,9,'h'); D(15,10,'H'); D(16,10,'H'); D(20,10,'H'); D(24,10,'H'); D(25,10,'H');
}
function hairNew(R,D,P) {
  R(11,5,28,9,'H'); R(11,10,12,13,'H'); R(27,10,28,12,'H');
  P([[10,7],[12,3],[16,2],[15,6]],'H');
  P([[14,5],[17,1],[22,0],[20,5]],'H');
  P([[19,5],[23,1],[28,1],[25,5]],'H');
  P([[24,6],[28,2],[31,3],[28,8]],'H');
  D(13,3,'L'); D(14,3,'L'); R(17,1,19,1,'L'); D(16,2,'L'); R(23,1,25,1,'L'); D(22,2,'L'); D(28,2,'L'); D(29,2,'L');
  D(15,4,'h'); D(16,3,'h'); D(20,4,'h'); D(21,3,'h'); D(25,4,'h'); D(26,3,'h');
  R(13,9,26,9,'h');
  D(14,10,'H'); D(15,10,'H'); D(15,11,'H'); D(19,10,'H'); D(20,10,'H'); D(20,11,'H'); D(24,10,'H'); D(25,10,'H');
}
function head(R,D,P,newHair) {
  R(11,6,28,24,'S'); R(11,15,11,22,'s');
  D(11,23,'.'); D(11,24,'.'); D(12,24,'.'); D(28,23,'.'); D(28,24,'.'); D(27,24,'.');
  R(13,24,26,24,'s'); D(12,23,'s'); D(27,23,'s');
  R(9,15,10,18,'S'); R(29,15,30,18,'S'); D(10,16,'s'); D(10,17,'s'); D(29,16,'s'); D(29,17,'s');
  newHair ? hairNew(R,D,P) : hairOld(R,D);
  R(14,12,17,12,'h'); R(22,12,25,12,'h'); D(14,13,'h'); D(25,13,'h');
  R(15,14,17,16,'E'); R(22,14,24,16,'E'); D(15,14,'X'); D(22,14,'X');
  R(19,17,20,18,'s');
  R(16,20,23,22,'m'); R(17,20,22,20,'X'); D(16,22,'S'); D(23,22,'S');
}

function outline(g) {
  const out = g.map(r => r.slice());
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++) {
    if (g[y][x] !== '.') continue;
    if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => { const c = g[y+dy]?.[x+dx]; return c && c !== '.'; })) out[y][x] = 'O';
  }
  return out;
}
function build(outfit, newHair) {
  const t = grid();
  base(t.R,t.D); OUTFITS[outfit].draw(t); head(t.R,t.D,t.P,newHair);
  return outline(t.g);
}
function render(gr, scale, rows) {
  const h = rows || GH;
  const c = document.createElement('canvas'); c.width = GW*scale; c.height = h*scale;
  const x = c.getContext('2d');
  for (let y=0;y<h;y++) gr[y].forEach((p,i) => { if (p !== '.') { x.fillStyle = PAL[p]; x.fillRect(i*scale, y*scale, scale, scale); } });
  return c;
}
function cell(target, canvas, name, note) {
  const d = document.createElement('div'); d.className = 'cell'; d.appendChild(canvas);
  d.insertAdjacentHTML('beforeend', `<b>${name}</b>` + (note ? `<span>${note}</span>` : ''));
  document.getElementById(target).appendChild(d);
}

cell('hair', render(build('track',false),5,28), 'vorher', 'Spitzen = Krone');
cell('hair', render(build('track',true),5,28), 'nachher', 'Strähnen geweht, asymmetrisch');
Object.keys(OUTFITS).forEach(k => cell('outfits', render(build(k,true),4), OUTFITS[k].name, OUTFITS[k].note));
</script>
</body>
</html>
