<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melly · Galerie</title>
<style>
  :root { --ink:#0B1620; --paper:#F5F3EE; --muted:#6B7280; --line:#E4E0D8; --navy:#041C2C; --brass:#E3A33B; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:26px; margin:0 0 4px; } h2 { font-size:18px; margin:30px 0 10px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 18px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; cursor:pointer; }
  .combo { background:#fff; border:2px solid var(--line); border-radius:12px; padding:8px; display:flex; flex-direction:column; align-items:center; color:inherit; }
  .combo[aria-pressed="true"] { border-color:var(--brass); }
  .combo span { font-size:12px; color:var(--muted); margin-top:4px; }
  .tab { background:#fff; border:1px solid var(--line); border-radius:99px; padding:6px 14px; font-size:13px; color:inherit; }
  .tab[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; margin-top:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; }
  .card h3 { font-size:15px; margin:0 0 2px; display:flex; justify-content:space-between; gap:8px; }
  .card h3 code { font-size:11px; color:var(--muted); font-weight:400; }
  .card p { font-size:13px; color:var(--muted); margin:0 0 8px; }
  .play { display:flex; gap:6px; align-items:flex-end; }
  .bg { border-radius:10px; padding:4px; }
  .stills { display:flex; gap:8px; flex-wrap:wrap; }
  .still { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px; display:flex; flex-direction:column; align-items:center; }
  .still span { font-size:12px; color:var(--muted); margin-top:4px; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
</style>
</head>
<body>
<main>
  <h1>Melly</h1>
  <p class="sub">Pixel-Maskottchen · Name aus dem Kürzel MEL · Quelle der Wahrheit: <code>src/</code> · Kombi oder Outfit wählen, alles färbt mit</p>

  <div class="bar" id="combos"></div>
  <div class="bar" id="outfits" style="margin-top:8px"></div>
  <div class="bar" id="accs" style="margin-top:8px"></div>
  <h2>Posen &amp; Animationen</h2>
  <div class="bar" id="tabs"></div>
  <div class="grid" id="poses"></div>

  <h2>Ansichten</h2>
  <div class="stills" id="views"></div>

  <h2>Mimik</h2>
  <div class="stills" id="faces"></div>
</main>

<script type="module">
import { COMBOS, VIEW_LABELS, TURNAROUND, GW, GH } from './src/model.js';
import { POSES, CATEGORIES, LIB, OUTFITS, ACCESSORIES, getAccessory, buildFrames, fitsOutfit, fitsAccessory } from './src/registry.js';
import { frame } from './src/core.js';
import { EXPRESSIONS } from './src/expressions.js';
import { drawFrame } from './src/render.js';

let combo = 0, cat = 'Alle', outfit = null;
const accs = new Set(); // Accessoires an/aus, kombinierbar
const timers = [];
const canvas = s => { const c = document.createElement('canvas'); c.width = GW * s; c.height = GH * s; return c; };

function player(frames, s, bg) {
  const wrap = document.createElement('div'); wrap.className = 'bg'; wrap.style.background = bg;
  const c = canvas(s); wrap.appendChild(c);
  const ctx = c.getContext('2d'); let i = 0;
  const tick = () => { drawFrame(ctx, frames[i], s, combo); const ms = frames[i].ms; i = (i + 1) % frames.length; timers.push(setTimeout(tick, ms)); };
  tick(); return wrap;
}
function still(target, f, s, label) {
  const d = document.createElement('div'); d.className = 'still';
  const c = canvas(s); drawFrame(c.getContext('2d'), f, s, combo); d.appendChild(c);
  d.insertAdjacentHTML('beforeend', `<span>${label}</span>`); target.appendChild(d);
}
function render() {
  timers.splice(0).forEach(clearTimeout);
  const combos = document.getElementById('combos'); combos.innerHTML = '';
  COMBOS.forEach((cb, i) => {
    const b = document.createElement('button'); b.className = 'combo'; b.setAttribute('aria-pressed', i === combo);
    const c = canvas(3); drawFrame(c.getContext('2d'), LIB.frame([], 0), 3, i); b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<span>${cb[0]}</span>`); b.onclick = () => { combo = i; render(); };
    combos.appendChild(b);
  });
  const ob = document.getElementById('outfits'); ob.innerHTML = '';
  [null, ...OUTFITS].forEach(o => {
    const b = document.createElement('button'); b.className = 'combo'; b.setAttribute('aria-pressed', (o ? o.id : null) === outfit);
    const c = canvas(3); drawFrame(c.getContext('2d'), frame([], 0, o ? { outfit: o } : {}), 3, combo); b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<span>${o ? 'Outfit: ' + o.title : 'Ohne Outfit'}</span>`); b.onclick = () => { outfit = o ? o.id : null; render(); };
    ob.appendChild(b);
  });
  const ab = document.getElementById('accs'); ab.innerHTML = '';
  ACCESSORIES.forEach(a => {
    const b = document.createElement('button'); b.className = 'combo'; b.setAttribute('aria-pressed', accs.has(a.id));
    const c = canvas(3); drawFrame(c.getContext('2d'), frame([], 0, { accessories: [a] }), 3, combo); b.appendChild(c);
    b.insertAdjacentHTML('beforeend', `<span>+ ${a.title}</span>`); b.onclick = () => { accs.has(a.id) ? accs.delete(a.id) : accs.add(a.id); render(); };
    ab.appendChild(b);
  });
  const O = OUTFITS.find(o => o.id === outfit), A = [...accs].map(getAccessory);
  const tabs = document.getElementById('tabs'); tabs.innerHTML = '';
  ['Alle', ...CATEGORIES].forEach(c => {
    const b = document.createElement('button'); b.className = 'tab'; b.textContent = c; b.setAttribute('aria-pressed', c === cat);
    b.onclick = () => { cat = c; render(); }; tabs.appendChild(b);
  });
  const grid = document.getElementById('poses'); grid.innerHTML = '';
  POSES.filter(p => (cat === 'Alle' || p.category === cat) && (!outfit || ((!p.outfit || p.outfit === outfit) && fitsOutfit(p, outfit))) && [...accs].every(a => fitsAccessory(p, a))).forEach(p => {
    const frames = buildFrames(p, outfit || undefined, [...accs]);
    const d = document.createElement('section'); d.className = 'card';
    d.innerHTML = `<h3>${p.title}<code>${p.id}</code></h3><p>${p.desc}</p><div class="play"></div>`;
    d.querySelector('.play').append(player(frames, 5, '#FFFFFF'), player(frames, 5, '#041C2C'), player(frames, 2, '#F5F3EE'));
    grid.appendChild(d);
  });
  const views = document.getElementById('views'); views.innerHTML = '';
  TURNAROUND.filter(v => (!O || O.layers[v]) && A.every(a => a.layers[v])).forEach(v => still(views, frame([], 0, { view: v, outfit: O, accessories: A }), 4, VIEW_LABELS[v]));
  const faces = document.getElementById('faces'); faces.innerHTML = '';
  EXPRESSIONS.forEach(e => still(faces, frame(e.mods(LIB), 0, { ...(e.opt ? e.opt(LIB) : {}), outfit: O, accessories: A }), 4, e.title));
}
render();
</script>
</body>
</html>
